name: Stasis iPhone download

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify dependency pins
        run: bash .github/scripts/check_sibling_pins.sh

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/ios-v')
        shell: bash
        run: |
          app_version=$(sed -n 's/^version: \([^+]*\)+[0-9][0-9]*$/\1/p' pubspec.yaml)
          if [[ -z "$app_version" || "$GITHUB_REF_NAME" != "ios-v$app_version" ]]; then
            echo "::error::Expected an ios-v tag matching the pubspec version (including a +BUILD suffix)."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get

      # Firebase diagnostics stay disabled. AI and the optional mirror have no
      # baked-in endpoints; users can configure them in the app.
      - name: Build unsigned iPhone app
        run: flutter build ios --release --no-codesign --dart-define=STASIS_FIREBASE_ENABLED=false

      # A free-Apple-ID resigner changes the phone app's bundle ID, which breaks
      # the Watch companion's fixed cross-reference. Keep the phone app and widget.
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          rm -rf build/ios/iphoneos/Runner.app/Watch
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/Runner.app
          (cd dist && zip -qry Stasis-iOS-unsigned.ipa Payload)
          (cd dist && shasum -a 256 Stasis-iOS-unsigned.ipa > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Stasis-iPhone-unsigned
          path: |
            dist/Stasis-iOS-unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish iPhone download
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Stasis-iOS-unsigned.ipa
            dist/SHA256SUMS.txt
          body: |
            Download `Stasis-iOS-unsigned.ipa` and install it with Sideloadly or AltStore. The IPA is unsigned; an iPhone cannot install it directly from Safari. See `guides/IOS_SIDELOAD.md` for instructions. The Watch app is excluded from this sideload build.
